[package]
name = "yt-down"
version = "0.1.0"
description = "A small, queued YouTube downloader"
authors = ["Nipun Yatawara"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rfd = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
